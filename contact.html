<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Contact</title>
  </head>
  <body>
    <nav aria-label="Main navigation">
      <div class="logo">
        <img
          src="img/icons8-hanger-64.png"
          alt="Website Logo"
          style="width: 60px; height: auto"
        />
      </div>
      <ul class="nav-links">
        <li>
          <a href="index.html">Home</a>
        </li>
        <li>
          <a href="services.html">Services</a>
        </li>
        <li>
          <a href="contact.html">Contact</a>
        </li>
      </ul>
    </nav>

    <header></header>
    <main>
      <form class="contact-form">
        <h2>Contact Us</h2>

        <label for="name" aria-required="true">Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Your name"
          required
        />

        <label for="email" aria-required="true">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Your email"
          required
        />

        <label for="message" aria-required="true">Message</label>
        <textarea
          id="message"
          name="message"
          placeholder="Write your message..."
          rows="5"
          required
        ></textarea>

        <button type="submit">Send Message</button>
      </form>
    </main>
    <footer>
      <div class="footer-container">
        <h3>Flea Market</h3>

        <p>Buy, sell, and discover unique items online.</p>

        <ul class="footer-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="services.html">Shop</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>

        <p class="copyright">© 2026 Flea Market. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
