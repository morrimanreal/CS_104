<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Flea Market</title>
</head>
<body>
   <nav aria-label="Main navigation">
    <div class="logo">
    <img
      src="img/icons8-hanger-64.png" 
      alt="Website Logo" 
      style="width: 60px; height: auto;"
      >
    </div>
    <ul>
      <li><a href="#" style="color: white; text-decoration: none;">Home</a></li>
      <li><a href="#" style="color: white; text-decoration: none;">Services</a></li>
      <li><a href="#" style="color: white; text-decoration: none;">Contact</a></li>
    </ul>
   </nav>
  
<header>
    <h1 class="title" aria-label="title">
      Flea Market
    </h1>

    <h2 class="description">
      An online thrift store sold by the people for the people.
    </h2>
    </header>

    <main>
    <ul class="services-options">
    <li>Buy & Sell</li>
    <li>Appraisals</li>
    <li>Vintage Finds</li>
    </ul>

    <div class="product">

      <!-- Product Card -->
      <div class="product-card">

        <img 
          src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?q=80&w=800&auto=format&fit=crop"
          alt="T-Shirt"
        >

        <div class="product-card-desc-box">
          <h3>Classic T-Shirt</h3>
          <p class="product-card-desc">Comfortable everyday wear.</p>
          <p class="product-card-price">$29.99</p>
        </div>

        
      </div>
    </main>
    <footer>
      <nav aria-label="Footer navigation">
      <ul>
        <li><a href="/about">About</a></li>
        <li><a href="/privacy">Privacy Policy</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>
    </footer>
</body>
</html>
